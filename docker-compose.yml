version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: pathforge-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: pathforge
      MYSQL_USER: pathforge
      MYSQL_PASSWORD: pathforge123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pathforge-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/pathforge
      - SPRING_DATASOURCE_USERNAME=pathforge
      - SPRING_DATASOURCE_PASSWORD=pathforge123
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pathforge-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mysql_data:
