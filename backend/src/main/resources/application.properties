# Server
server.port=${PORT:8080}

# Load local .env (gitignored) for secrets like the AI API key
spring.config.import=optional:file:.env[.properties]

# Database - Persistent H2 file (survives backend restarts) so returning
# users are restored after logout/login or on a new browser. For production,
# use MySQL/PostgreSQL via docker-compose.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/pathforge}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# AI Configuration — Groq (primary) + Gemini (fallback)
#   groq.api.key   reads GROQ_API_KEY from the environment
#   ai.api.key     reads AI_API_KEY or GEMINI_API_KEY (legacy fallback)
#   ai.api.url     reads AI_API_URL / GEMINI_API_URL; default is the OpenAI-compatible gateway
#   ai.api.model   reads AI_API_MODEL / GEMINI_API_MODEL
groq.api.key=${GROQ_API_KEY:}
groq.api.url=${GROQ_API_URL:https://api.groq.com/openai/v1/chat/completions}
groq.api.model=${GROQ_API_MODEL:qwen/qwen3.6-27b}
ai.api.key=${AI_API_KEY:${GEMINI_API_KEY:}}
ai.api.url=${AI_API_URL:${GEMINI_API_URL:https://api.free.ai/v1/chat/completions}}
ai.api.model=${AI_API_MODEL:${GEMINI_API_MODEL:qwen3-8b}}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://pathforage.onrender.com}

# Demo Mode
app.demo.enabled=true
