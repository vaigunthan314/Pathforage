# Server
server.port=8080

# Load local .env (gitignored) for secrets like the AI API key
spring.config.import=optional:file:.env[.properties]

# Database - Persistent H2 file (survives backend restarts) so returning
# users are restored after logout/login or on a new browser. For production,
# use MySQL/PostgreSQL via docker-compose.
spring.datasource.url=jdbc:h2:file:./data/pathforge
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# AI Configuration (OpenAI-compatible chat completions endpoint)
ai.api.key=${AI_API_KEY:}
ai.api.url=https://api.free.ai/v1/chat/completions
ai.api.model=qwen3-8b

# CORS
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# Demo Mode
app.demo.enabled=true
