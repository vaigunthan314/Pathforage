# Server
server.port=${PORT:8080}

# Load local .env (gitignored) for secrets — optional, so Render env vars take
# precedence when the file is absent.
spring.config.import=optional:file:.env[.properties]

# Database - Persistent H2 file (survives backend restarts) so returning
# users are restored after logout/login or on a new browser. For production,
# use MySQL/PostgreSQL via docker-compose.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/pathforge}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# AI Configuration — Groq (primary) + legacy fallback
#   All values read from environment variables first; .env file is fallback.
#   On Render, set these as environment variables — do NOT rely on .env.
groq.api.key=${GROQ_API_KEY:${AI_API_KEY:${GEMINI_API_KEY:}}}
groq.api.url=${GROQ_API_URL:https://api.groq.com/openai/v1/chat/completions}
groq.api.model=${GROQ_API_MODEL:openai/gpt-oss-120b}
ai.api.key=${AI_API_KEY:${GEMINI_API_KEY:}}
ai.api.url=${AI_API_URL:${GEMINI_API_URL:https://api.free.ai/v1/chat/completions}}
ai.api.model=${AI_API_MODEL:${GEMINI_API_MODEL:qwen3-8b}}

# CORS — explicit origin list; never use wildcard with credentials.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://pathforage.onrender.com}

# Demo Mode
app.demo.enabled=true
